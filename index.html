<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Progress">
<title>Progress</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231C2128'/%3E%3Ccircle cx='50' cy='50' r='32' fill='none' stroke='%23D4A24C' stroke-width='8'/%3E%3Cpath d='M50 18 A32 32 0 0 1 78 62' fill='none' stroke='%23D4A24C' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#1C2128;
    --bg-elev:#242B34;
    --bg-elev-2:#2C3542;
    --line:#3A4452;
    --ink:#EDE6D6;
    --ink-dim:#9AA5B1;
    --ink-faint:#6B7684;
    --accent:#D4A24C;
    --accent-soft:#D4A24C33;
    --danger:#C0685A;
    --sub:#4C9A5B;
    --sub-press:#428650;
    --micro:#4A90D9;
    --micro-press:#3F7EC0;
    --radius:14px;
    --radius-sm:9px;
    font-size:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    overscroll-behavior-y:none;
  }
  .mono{font-family:"SF Mono",ui-monospace,Menlo,monospace;}

  header{
    position:sticky;top:0;z-index:10;
    background:linear-gradient(var(--bg) 80%, transparent);
    padding:calc(env(safe-area-inset-top) + 18px) 16px 10px 20px;
    display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
  }
  header h1{
    margin:0;font-size:1.5rem;font-weight:700;letter-spacing:-0.02em;
  }
  header .sub{
    margin-top:2px;color:var(--ink-dim);font-size:0.85rem;
  }

  main{padding:6px 16px 120px;max-width:640px;margin:0 auto;}

  .empty{
    text-align:center;color:var(--ink-faint);padding:60px 20px;
    display:flex;flex-direction:column;align-items:center;gap:10px;
  }
  .empty svg{opacity:0.5;}
  .empty .cta{color:var(--accent);font-weight:600;}

  .category{
    margin:18px 0;
    background:var(--bg-elev);
    border-radius:var(--radius);
    overflow:hidden;
    border:1px solid var(--line);
  }
  .category-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;cursor:pointer;user-select:none;
  }
  .category-head-left{display:flex;align-items:center;gap:10px;min-width:0;}
  .cat-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;}
  .category-head h2{
    font-size:1.02rem;margin:0;font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .cat-count{
    color:var(--ink-faint);font-size:0.82rem;flex-shrink:0;
    font-family:"SF Mono",ui-monospace,Menlo,monospace;
  }
  .chevron{
    color:var(--ink-faint);transition:transform 0.25s ease;flex-shrink:0;margin-left:8px;
  }
  .category.collapsed .chevron{transform:rotate(-90deg);}
  .category-body{
    max-height:4000px;
    transition:max-height 0.3s ease, opacity 0.2s ease;
    opacity:1;
  }
  .category.collapsed .category-body{
    max-height:0;opacity:0;
  }

  .goal{
    padding:12px 16px 14px;
    border-top:1px solid var(--line);
    display:flex;align-items:center;gap:12px;
  }
  .goal-content{flex:1;min-width:0;}
  .goal-top{
    display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px;
  }
  .goal-name{font-size:0.95rem;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .goal-stats{
    display:flex;align-items:baseline;gap:6px;flex-shrink:0;
    font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:0.82rem;color:var(--ink-dim);
  }
  .goal-pct{color:var(--ink);font-weight:600;}
  .bar-track{
    height:9px;border-radius:5px;background:var(--bg-elev-2);overflow:hidden;position:relative;
  }
  .bar-fill{
    height:100%;border-radius:5px;transition:width 0.4s cubic-bezier(.2,.8,.2,1);
    position:relative;
  }
  .bar-fill::after{
    content:'';position:absolute;right:0;top:0;bottom:0;width:6px;
    background:rgba(255,255,255,0.35);filter:blur(1px);
  }
  .goal-actions{
    display:flex;gap:14px;margin-top:9px;
  }
  .goal-actions button{
    background:none;border:none;color:var(--ink-faint);font-size:0.78rem;
    padding:4px 0;cursor:pointer;font-weight:500;
  }
  .goal-actions button:active{color:var(--accent);}
  .goal-actions .del{color:var(--danger);opacity:0.75;}
  .quickadd-btn{
    flex-shrink:0;width:42px;height:42px;border-radius:50%;
    background:var(--accent);color:#1C1710;border:none;
    font-size:1.4rem;font-weight:700;line-height:1;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 3px 10px rgba(212,162,76,0.35);
  }
  .quickadd-btn:active{background:#BF8F3F;}

  .fab-row{
    position:fixed;left:0;right:0;bottom:0;
    padding:14px 20px calc(env(safe-area-inset-bottom) + 14px);
    display:flex;gap:10px;justify-content:center;
    background:linear-gradient(transparent, var(--bg) 40%);
  }
  .fab{
    background:var(--accent);color:#1C1710;border:none;
    padding:13px 22px;border-radius:100px;font-size:0.95rem;font-weight:700;
    box-shadow:0 6px 20px rgba(0,0,0,0.35);
    display:flex;align-items:center;gap:8px;
  }
  .fab.secondary{
    background:var(--bg-elev-2);color:var(--ink-dim);font-weight:600;font-size:0.85rem;
    padding:13px 16px;border:1px solid var(--line);
  }

  .sheet-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:20;
    opacity:0;pointer-events:none;transition:opacity 0.25s ease;
  }
  .sheet-backdrop.open{opacity:1;pointer-events:auto;}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:21;
    background:var(--bg-elev);border-radius:20px 20px 0 0;
    padding:20px 20px calc(env(safe-area-inset-bottom) + 20px);
    transform:translateY(100%);transition:transform 0.3s cubic-bezier(.2,.9,.25,1);
    max-height:88vh;overflow-y:auto;
    border-top:1px solid var(--line);
  }
  .sheet.open{transform:translateY(0);}
  .sheet.has-footer{display:flex;flex-direction:column;overflow:hidden;padding-bottom:0;}
  .sheet.has-footer .sheet-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px;}
  .sheet.has-footer .sheet-footer{
    flex-shrink:0;background:var(--bg-elev);border-top:1px solid var(--line);
    margin:0 -20px;padding:10px 20px calc(env(safe-area-inset-bottom) + 14px);
  }
  .sheet.has-footer .sheet-submit{margin-top:0;}
  .sheet.has-footer .sheet-cancel{margin-top:6px;}
  .sheet-handle{
    width:36px;height:4px;background:var(--line);border-radius:3px;margin:0 auto 16px;
  }
  .sheet h3{margin:0 0 16px;font-size:1.15rem;}
  label{display:block;font-size:0.8rem;color:var(--ink-dim);margin:14px 0 6px;font-weight:600;text-transform:uppercase;letter-spacing:0.03em;}
  label:first-of-type{margin-top:0;}
  input[type=text], input[type=number]{
    width:100%;background:var(--bg-elev-2);border:1px solid var(--line);color:var(--ink);
    padding:12px 13px;border-radius:var(--radius-sm);font-size:1rem;
    font-family:inherit;
  }
  input[type=number]{-moz-appearance:textfield;appearance:textfield;}
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{
    -webkit-appearance:none;margin:0;
  }
  input:focus{outline:none;border-color:var(--accent);}
  .row2{display:flex;gap:10px;}
  .row2 > div{flex:1;}
  select{
    width:100%;background:var(--bg-elev-2);border:1px solid var(--line);color:var(--ink);
    padding:12px 13px;border-radius:var(--radius-sm);font-size:1rem;font-family:inherit;
    appearance:none;
  }
  .newcat-toggle{
    font-size:0.8rem;color:var(--accent);margin-top:8px;display:inline-block;cursor:pointer;font-weight:600;
  }
  .swatches{display:flex;gap:9px;margin-top:8px;flex-wrap:wrap;}
  .swatch{
    width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;flex-shrink:0;
  }
  .swatch.selected{border-color:var(--ink);}
  .sheet-submit{
    width:100%;margin-top:22px;background:var(--accent);color:#1C1710;
    border:none;padding:14px;border-radius:var(--radius-sm);font-weight:700;font-size:1rem;
  }
  .sheet-cancel{
    width:100%;margin-top:10px;background:none;color:var(--ink-faint);
    border:none;padding:8px;font-size:0.9rem;
  }

  .settings-menu{
    position:relative;flex-shrink:0;z-index:15;
  }
  .icon-btn{
    background:var(--bg-elev-2);border:1px solid var(--line);color:var(--ink-dim);
    width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  }
  .settings-panel{
    position:absolute;top:46px;right:0;background:var(--bg-elev-2);border:1px solid var(--line);
    border-radius:var(--radius-sm);padding:6px;min-width:190px;
    box-shadow:0 8px 24px rgba(0,0,0,0.4);
    display:none;
    z-index:16;
  }
  .settings-panel.open{display:block;}
  .settings-panel button{
    display:block;width:100%;text-align:left;background:none;border:none;color:var(--ink);
    padding:10px 12px;font-size:0.88rem;border-radius:7px;
  }
  .settings-panel button:active{background:var(--bg-elev);}
  .settings-panel button.danger{color:var(--danger);}
  #importFile{display:none;}
  .toast{
    position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:100px;
    font-size:0.85rem;font-weight:600;opacity:0;transition:all 0.3s ease;z-index:30;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* Subtasks - main screen */
  .subtoggle-btn{background:var(--bg-elev-2);color:var(--ink-dim);box-shadow:none;}
  .subtoggle-btn:active{background:var(--line);}
  .subtoggle-btn svg{transition:transform 0.25s ease;}
  .goal.sub-expanded .subtoggle-btn svg{transform:rotate(180deg);}
  .subtask-list{
    max-height:0;overflow:hidden;
    transition:max-height 0.3s ease, margin 0.3s ease;margin-top:0;
  }
  .goal.sub-expanded .subtask-list{max-height:3000px;margin-top:8px;}
  .subtask-row-wrap{border-top:1px solid var(--line);padding:8px 0;}
  .subtask-row{
    display:flex;align-items:center;gap:10px;
  }
  .subtask-info{flex:1;min-width:0;}
  .subtask-name{font-size:0.85rem;font-weight:500;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .subtask-bar-track{height:6px;border-radius:4px;background:var(--bg-elev-2);overflow:hidden;}
  .subtask-bar-fill{height:100%;border-radius:4px;transition:width 0.3s ease;}
  .subtask-stats{font-size:0.72rem;color:var(--ink-faint);margin-top:4px;font-family:"SF Mono",ui-monospace,Menlo,monospace;}
  .subquickadd-btn{
    flex-shrink:0;width:34px;height:34px;border-radius:50%;
    background:var(--sub);color:#fff;border:none;font-size:1.2rem;font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .subquickadd-btn:active{background:var(--sub-press);}
  .microtoggle-btn{background:var(--bg-elev-2);color:var(--ink-dim);}
  .microtoggle-btn:active{background:var(--line);}
  .microtoggle-btn svg{transition:transform 0.25s ease;}
  .subtask-row-wrap.micro-expanded .microtoggle-btn svg{transform:rotate(180deg);}

  /* Microtasks - main screen */
  .microtask-list{
    max-height:0;overflow:hidden;margin-left:14px;
    transition:max-height 0.3s ease, margin 0.3s ease;margin-top:0;
  }
  .subtask-row-wrap.micro-expanded .microtask-list{max-height:2000px;margin-top:6px;}
  .microtask-row{
    display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px dashed var(--line);
  }
  .microtask-info{flex:1;min-width:0;}
  .microtask-name{font-size:0.78rem;font-weight:500;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .microtask-bar-track{height:5px;border-radius:3px;background:var(--bg-elev);overflow:hidden;}
  .microtask-bar-fill{height:100%;border-radius:3px;transition:width 0.3s ease;}
  .microtask-stats{font-size:0.68rem;color:var(--ink-faint);margin-top:3px;font-family:"SF Mono",ui-monospace,Menlo,monospace;}
  .microquickadd-btn{
    flex-shrink:0;width:27px;height:27px;border-radius:50%;
    background:var(--micro);color:#fff;border:none;font-size:1rem;font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .microquickadd-btn:active{background:var(--micro-press);}

  /* Subtask summary cards - inside Goal sheet */
  .subtask-summary-card{
    background:var(--bg-elev-2);border:1px solid var(--line);border-left:3px solid var(--sub);border-radius:var(--radius-sm);
    padding:10px 12px;margin-top:10px;
  }
  .subtask-summary-top{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .subtask-summary-name{font-weight:600;font-size:0.9rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);}
  .subtask-summary-meta{font-size:0.76rem;color:var(--ink-faint);margin-top:4px;font-family:"SF Mono",ui-monospace,Menlo,monospace;}
  .subtask-edit-btn{
    margin-top:8px;width:100%;background:var(--bg-elev);border:1px solid var(--line);color:var(--sub);
    padding:8px;border-radius:8px;font-weight:600;font-size:0.85rem;
  }
  .rm-btn{
    flex-shrink:0;width:30px;height:30px;border-radius:50%;background:var(--bg-elev);
    border:1px solid var(--line);color:var(--danger);font-size:1rem;
  }
  .subtask-add-btn{
    margin-top:10px;width:100%;background:var(--bg-elev-2);border:1px dashed var(--sub);color:var(--sub);
    padding:10px;border-radius:var(--radius-sm);font-weight:600;font-size:0.88rem;
  }
  .micro-add-btn{border-color:var(--micro);color:var(--micro);}
  #saveSubtaskBtn{background:var(--sub);color:#0E1A11;}
  .manual-field.disabled{opacity:0.4;pointer-events:none;}

  /* Microtask summary cards - inside Subtask sheet (blue) */
  .microtask-summary-card{
    background:var(--bg-elev-2);border:1px solid var(--line);border-left:3px solid var(--micro);border-radius:var(--radius-sm);
    padding:10px 12px;margin-top:10px;
  }
  .micro-edit-btn{
    margin-top:8px;width:100%;background:var(--bg-elev);border:1px solid var(--line);color:var(--micro);
    padding:8px;border-radius:8px;font-weight:600;font-size:0.85rem;
  }
  #saveMicrotaskBtn{background:var(--micro);color:#fff;}

  /* Each level's sheet gets its own accent so it's obvious which one you're in */
  #goalSheet{border-top:3px solid var(--accent);}
  #subtaskSheet{border-top:3px solid var(--sub);}
  #microtaskSheet{border-top:3px solid var(--micro);}
  #subtaskSheet input:focus{border-color:var(--sub);}
  #microtaskSheet input:focus{border-color:var(--micro);}

  /* Archive sheet */
  .archive-item{
    background:var(--bg-elev-2);border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:12px;margin-bottom:10px;
  }
  .archive-item-top{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .archive-item-name{font-weight:600;font-size:0.92rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .archive-item-pct{font-size:0.8rem;color:var(--ink-dim);font-family:"SF Mono",ui-monospace,Menlo,monospace;flex-shrink:0;}
  .archive-item-cat{font-size:0.75rem;color:var(--ink-faint);margin-top:2px;}
  .archive-item-actions{display:flex;gap:16px;margin-top:9px;}
  .archive-item-actions button{background:none;border:none;font-size:0.78rem;font-weight:600;padding:0;}
  .archive-item-actions .restore{color:var(--accent);}
  .archive-item-actions .forget{color:var(--danger);}
  .archive-empty{color:var(--ink-faint);text-align:center;padding:30px 10px;font-size:0.88rem;}

  /* In-app confirm dialog */
  .confirm-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:40;
    display:none;align-items:center;justify-content:center;padding:24px;
  }
  .confirm-overlay.open{display:flex;}
  .confirm-box{
    width:100%;max-width:340px;background:var(--bg-elev);border:1px solid var(--line);
    border-radius:var(--radius);padding:20px;box-shadow:0 12px 40px rgba(0,0,0,0.5);
  }
  .confirm-msg{font-size:0.98rem;line-height:1.45;margin:0 0 18px;color:var(--ink);}
  .confirm-btns{display:flex;gap:10px;}
  .confirm-btns button{
    flex:1;padding:13px;border-radius:var(--radius-sm);font-size:0.95rem;font-weight:700;border:1px solid var(--line);
  }
  #confirmCancel{background:var(--bg-elev-2);color:var(--ink-dim);}
  #confirmOk{background:var(--danger);color:#fff;border-color:var(--danger);}

  /* Reorder sheet */
  .reorder-item{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);}
  .reorder-item:first-child{border-top:none;}
  .reorder-name{flex:1;font-size:0.9rem;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .reorder-btns{display:flex;gap:6px;flex-shrink:0;}
  .reorder-btns button{
    width:32px;height:32px;border-radius:8px;background:var(--bg-elev-2);border:1px solid var(--line);
    color:var(--ink-dim);font-size:0.85rem;
  }
  .reorder-btns button:disabled{opacity:0.3;}
  .reorder-btns button:not(:disabled):active{color:var(--accent);}
  .reorder-btns button{display:flex;align-items:center;justify-content:center;}
  .reorder-btns .del{color:var(--danger);}
</style>
</head>
<body>

<input type="file" id="importFile" accept="application/json">

<header>
  <div>
    <h1>Progress</h1>
    <div class="sub" id="headerSub">Loading…</div>
  </div>
  <div class="settings-menu">
    <button class="icon-btn" id="settingsBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </button>
    <div class="settings-panel" id="settingsPanel">
      <button id="reorderBtn">Manage categories</button>
      <button id="archiveViewBtn">View archive</button>
      <button id="exportBtn">Export backup</button>
      <button id="importBtn">Import backup</button>
      <button class="danger" id="clearBtn">Clear all data</button>
    </div>
  </div>
</header>

<main id="main"></main>

<div class="fab-row">
  <button class="fab secondary" id="newCatFab">+ Category</button>
  <button class="fab" id="newGoalFab">+ Goal</button>
</div>

<div class="sheet-backdrop" id="backdrop"></div>

<!-- Goal sheet -->
<div class="sheet has-footer" id="goalSheet">
  <div class="sheet-handle"></div>
  <h3 id="goalSheetTitle">New Goal</h3>
  <div class="sheet-body">
  <input type="text" id="goalName" placeholder="Name" maxlength="60">
  <div class="row2">
    <div class="manual-field" id="currentFieldWrap">
      <input type="number" id="goalAmount" placeholder="Current" inputmode="decimal">
    </div>
    <div>
      <input type="number" id="goalMax" placeholder="Target" inputmode="decimal">
    </div>
  </div>
  <input type="text" id="goalUnit" placeholder="Label (optional)" maxlength="20" style="margin-top:10px;">
  <label>Category</label>
  <select id="goalCategory"></select>
  <span class="newcat-toggle" id="inlineNewCat">+ create new category</span>

  <label>Subtasks (optional)</label>
  <div id="subtaskEditorList"></div>
  <button type="button" class="subtask-add-btn" id="addSubtaskBtn">+ Add subtask</button>

  </div>
  <div class="sheet-footer">
    <button class="sheet-submit" id="saveGoalBtn">Save Goal</button>
    <button class="sheet-cancel" id="cancelGoalBtn">Cancel</button>
  </div>
</div>

  <div class="sheet-handle"></div>
  <h3>Edit Subtask</h3>
  <div class="sheet-body">
  <input type="text" id="subName" placeholder="Name" maxlength="60">
  <div class="row2">
    <div class="manual-field" id="subCurrentFieldWrap">
      <input type="number" id="subAmount" placeholder="Current" inputmode="decimal">
    </div>
    <div>
      <input type="number" id="subMax" placeholder="Target" inputmode="decimal">
    </div>
  </div>
  <input type="text" id="subUnit" placeholder="Label (optional)" maxlength="20" style="margin-top:10px;">

  <label>Microtasks (optional)</label>
  <div id="microtaskEditorList"></div>
  <button type="button" class="subtask-add-btn micro-add-btn" id="addMicrotaskBtn">+ Add microtask</button>

  </div>
  <div class="sheet-footer">
    <button class="sheet-submit" id="saveSubtaskBtn">Save Subtask</button>
    <button class="sheet-cancel" id="cancelSubtaskBtn">Cancel</button>
  </div>
</div>

<!-- Microtask sheet (stacks on top of Subtask sheet) -->
<div class="sheet has-footer" id="microtaskSheet">
  <div class="sheet-handle"></div>
  <h3>Edit Microtask</h3>
  <div class="sheet-body">
  <input type="text" id="microName" placeholder="Name" maxlength="60">
  <div class="row2">
    <div>
      <input type="number" id="microAmount" placeholder="Current" inputmode="decimal">
    </div>
    <div>
      <input type="number" id="microMax" placeholder="Target" inputmode="decimal">
    </div>
  </div>
  <input type="text" id="microUnit" placeholder="Label (optional)" maxlength="20" style="margin-top:10px;">
  </div>
  <div class="sheet-footer">
    <button class="sheet-submit" id="saveMicrotaskBtn">Save Microtask</button>
    <button class="sheet-cancel" id="cancelMicrotaskBtn">Cancel</button>

<!-- Category sheet -->
<div class="sheet" id="catSheet">
  <div class="sheet-handle"></div>
  <h3 id="catSheetTitle">New Category</h3>
  <label>Name</label>
  <input type="text" id="catName" placeholder="e.g. Savings" maxlength="30">
  <label>Color</label>
  <div class="swatches" id="swatches"></div>

<div class="sheet" id="archiveSheet">

</div>

<!-- Reorder sheet -->
<div class="sheet" id="reorderSheet">
  <div class="sheet-handle"></div>
  <h3>Manage Categories</h3>
  <div id="reorderList"></div>
  <button class="sheet-cancel" id="closeReorderBtn">Done</button>
</div>

<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <p class="confirm-msg" id="confirmMsg"></p>
    <div class="confirm-btns">
      <button type="button" id="confirmCancel">Cancel</button>
      <button type="button" id="confirmOk">Delete</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  const STORAGE_KEY = "progressTracker.v1";
  const COLLAPSE_KEY = "progressTracker.collapsed.v1";
  const PALETTE = ["#4FC3F7","#1E88E5","#AED581","#4CAF50","#FFF176","#FFCA28","#FF9800","#E53935","#F06292","#AB47BC","#673AB7","#7986CB","#E0E0E0"];

  let state = load();
  let collapsed = new Set(JSON.parse(localStorage.getItem(COLLAPSE_KEY) || "[]"));
  let subtasksExpanded = new Set();
  let microtasksExpanded = new Set();
  let editingGoalId = null;
  let editingSubtaskIndex = null;
  let editingMicroIndex = null;
  let microIsNew = false;
  let subtaskIsNew = false;
  let editingCategoryId = null;
  let pendingCategoryColor = PALETTE[0];
  let pendingSubtasks = [];
  let pendingMicrotasks = [];

  function normalizeGoal(g){
    if(!g.subtasks) g.subtasks = [];
    if(g.archived === undefined) g.archived = false;
    if(g.unit === undefined) g.unit = "";
    g.subtasks.forEach(s=>{
      if(!s.microtasks) s.microtasks = [];
      if(s.unit === undefined) s.unit = "";
      s.microtasks.forEach(m=>{
        if(m.unit === undefined) m.unit = "";
      });
    });
  }

  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const data = JSON.parse(raw);
        (data.goals||[]).forEach(normalizeGoal);
        return data;
      }
    }catch(e){}
    return { categories: [], goals: [] };
  }
  function save(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    render();
  }
  function saveCollapsed(){
    localStorage.setItem(COLLAPSE_KEY, JSON.stringify([...collapsed]));
  }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._h);
    toast._h = setTimeout(()=>t.classList.remove('show'), 1800);
  }

  // ---------- In-app confirm dialog (native confirm() is unreliable in home-screen apps) ----------
  let confirmCb = null;
  function askConfirm(message, onYes, okLabel){
    confirmCb = onYes;
    document.getElementById('confirmMsg').textContent = message;
    document.getElementById('confirmOk').textContent = okLabel || 'Delete';
    document.getElementById('confirmOverlay').classList.add('open');
  }
  function closeConfirm(){
    document.getElementById('confirmOverlay').classList.remove('open');
    confirmCb = null;
  }
  document.getElementById('confirmCancel').addEventListener('click', closeConfirm);
  document.getElementById('confirmOverlay').addEventListener('click', (e)=>{
    if(e.target.id === 'confirmOverlay') closeConfirm();
  });
  document.getElementById('confirmOk').addEventListener('click', ()=>{
    const cb = confirmCb;
    closeConfirm();
    if(cb) cb();
  });

  // ---------- Rendering ----------
  function render(){
    const main = document.getElementById('main');
    const sub = document.getElementById('headerSub');
    if(state.categories.length === 0){
      sub.textContent = "No categories yet";
      main.innerHTML = `<div class="empty">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 3"></path></svg>
        <div>Nothing tracked yet.</div>
        <div class="cta">Tap "+ Category" to get started</div>
      </div>`;
      return;
    }

    const activeGoals = state.goals.filter(g=>!g.archived);
    sub.textContent = `${state.categories.length} categor${state.categories.length===1?'y':'ies'} · ${activeGoals.length} goal${activeGoals.length===1?'':'s'}`;

    main.innerHTML = state.categories.map(cat => {
      const goals = activeGoals.filter(g => g.categoryId === cat.id);
      const catPct = goals.length ? Math.round(goals.reduce((s,g)=>s + goalPct(g), 0) / goals.length) : null;
      const isCollapsed = collapsed.has(cat.id);
      return `
      <div class="category ${isCollapsed?'collapsed':''}" data-cat="${cat.id}">
        <div class="category-head" data-toggle="${cat.id}">
          <div class="category-head-left">
            <span class="cat-dot" style="background:${cat.color}"></span>
            <h2>${escapeHtml(cat.name)}</h2>
          </div>
          <div style="display:flex;align-items:center;">
            <span class="cat-count">${goals.length}${catPct !== null ? ` · ${catPct}%` : ''}</span>
            <span class="chevron">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </span>
          </div>
        </div>
        <div class="category-body">
          ${goals.length === 0 ? `<div class="goal" style="color:var(--ink-faint);font-size:0.85rem;">No goals in this category yet.</div>` :
            goals.map(g => goalRow(g, cat)).join('')}
        </div>
      </div>`;
    }).join('');

    // bind category toggles
    main.querySelectorAll('[data-toggle]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const id = el.getAttribute('data-toggle');
        if(collapsed.has(id)) collapsed.delete(id); else collapsed.add(id);
        saveCollapsed();
        el.closest('.category').classList.toggle('collapsed');
      });
    });
    main.querySelectorAll('[data-edit]').forEach(el=>{
      el.addEventListener('click', (e)=>{ e.stopPropagation(); openGoalSheet(el.getAttribute('data-edit')); });
    });
    main.querySelectorAll('[data-del]').forEach(el=>{
      el.addEventListener('click', (e)=>{ e.stopPropagation(); deleteGoal(el.getAttribute('data-del')); });
    });
    main.querySelectorAll('[data-inc]').forEach(el=>{
      el.addEventListener('click', (e)=>{ e.stopPropagation(); bump(el.getAttribute('data-inc')); });
    });
    main.querySelectorAll('[data-subtoggle]').forEach(el=>{
      el.addEventListener('click', (e)=>{
        e.stopPropagation();
        const id = el.getAttribute('data-subtoggle');
        if(subtasksExpanded.has(id)) subtasksExpanded.delete(id); else subtasksExpanded.add(id);
        el.closest('.goal').classList.toggle('sub-expanded');
      });
    });
    main.querySelectorAll('[data-subinc]').forEach(el=>{
      el.addEventListener('click', (e)=>{
        e.stopPropagation();
        const [goalId, subId] = el.getAttribute('data-subinc').split('|');
        bumpSubtask(goalId, subId);
      });
    });
    main.querySelectorAll('[data-microtoggle]').forEach(el=>{
      el.addEventListener('click', (e)=>{
        e.stopPropagation();
        const id = el.getAttribute('data-microtoggle');
        if(microtasksExpanded.has(id)) microtasksExpanded.delete(id); else microtasksExpanded.add(id);
        el.closest('.subtask-row-wrap').classList.toggle('micro-expanded');
      });
    });
    main.querySelectorAll('[data-microinc]').forEach(el=>{
      el.addEventListener('click', (e)=>{
        e.stopPropagation();
        const [goalId, subId, microId] = el.getAttribute('data-microinc').split('|');
        bumpMicrotask(goalId, subId, microId);
      });
    });
    main.querySelectorAll('[data-archive]').forEach(el=>{
      el.addEventListener('click', (e)=>{ e.stopPropagation(); archiveGoal(el.getAttribute('data-archive')); });
    });
  }

  // ---------- Progress math (goal -> subtask -> microtask) ----------
  function clampPct(v){ return Math.min(100, Math.max(0, v)); }
  function unitSuffix(u){ return (u && String(u).trim()) ? ' ' + String(u).trim() : ''; }

  function goalHasSubtasks(g){ return g.subtasks && g.subtasks.length > 0; }
  function subtaskHasMicrotasks(s){ return s.microtasks && s.microtasks.length > 0; }

  function microtaskPct(m){
    if(!m.max || m.max <= 0) return 0;
    return clampPct((m.amount / m.max) * 100);
  }
  function microtaskCounterText(m){
    return `${fmtNum(m.amount)}/${fmtNum(m.max)}${unitSuffix(m.unit)}`;
  }

  function subtaskAmountEffective(s){
    if(subtaskHasMicrotasks(s)){
      return s.microtasks.reduce((sum, m) => sum + (microtaskPct(m) / 100), 0);
    }
    return s.amount;
  }
  function subtaskPct(s){
    if(!s.max || s.max <= 0) return 0;
    return clampPct((subtaskAmountEffective(s) / s.max) * 100);
  }
  function subtaskCounterText(s){
    return `${fmtNum(subtaskAmountEffective(s))}/${fmtNum(s.max)}${unitSuffix(s.unit)}`;
  }

  function goalAmountEffective(g){
    if(goalHasSubtasks(g)){
      return g.subtasks.reduce((sum, s) => sum + (subtaskPct(s) / 100), 0);
    }
    return g.amount;
  }
  function goalPct(g){
    if(!g.max || g.max <= 0) return 0;
    return clampPct((goalAmountEffective(g) / g.max) * 100);
  }
  function goalCounterText(g){
    return `${fmtNum(goalAmountEffective(g))}/${fmtNum(g.max)}${unitSuffix(g.unit)}`;
  }

  // ---------- Row templates ----------
  function goalRow(g, cat){
    const pct = goalPct(g);
    const displayPct = Math.round(pct);
    const hasSub = goalHasSubtasks(g);
    const expanded = subtasksExpanded.has(g.id);
    return `
      <div class="goal ${expanded?'sub-expanded':''}" data-goal="${g.id}">
        <div class="goal-content">
          <div class="goal-top">
            <div class="goal-name">${escapeHtml(g.name)}</div>
            <div class="goal-stats">
              <span>${goalCounterText(g)}</span>
              <span class="goal-pct">${displayPct}%</span>
            </div>
          </div>
          <div class="bar-track">
            <div class="bar-fill" style="width:${pct}%;background:${cat.color}"></div>
          </div>
          ${hasSub ? `
          <div class="subtask-list">
            ${g.subtasks.map(s => subtaskRow(g.id, s, cat)).join('')}
          </div>` : ``}
          <div class="goal-actions">
            <button data-edit="${g.id}">Edit</button>
            <button data-archive="${g.id}">Archive</button>
            <button class="del" data-del="${g.id}">Delete</button>
          </div>
        </div>
        ${hasSub
          ? `<button class="quickadd-btn subtoggle-btn" data-subtoggle="${g.id}">
               <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
             </button>`
          : `<button class="quickadd-btn" data-inc="${g.id}">+</button>`
        }
      </div>`;
  }

  function subtaskRow(goalId, s, cat){
    const pct = subtaskPct(s);
    const hasMicro = subtaskHasMicrotasks(s);
    const expanded = microtasksExpanded.has(s.id);
    return `
      <div class="subtask-row-wrap ${expanded?'micro-expanded':''}">
        <div class="subtask-row">
          <div class="subtask-info">
            <div class="subtask-name">${escapeHtml(s.name)}</div>
            <div class="subtask-bar-track"><div class="subtask-bar-fill" style="width:${pct}%;background:${cat.color}"></div></div>
            <div class="subtask-stats">${subtaskCounterText(s)} · ${Math.round(pct)}%</div>
          </div>
          ${hasMicro
            ? `<button class="subquickadd-btn microtoggle-btn" data-microtoggle="${s.id}">
                 <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
               </button>`
            : `<button class="subquickadd-btn" data-subinc="${goalId}|${s.id}">+</button>`
          }
        </div>
        ${hasMicro ? `
        <div class="microtask-list">
          ${s.microtasks.map(m => microtaskRow(goalId, s.id, m, cat)).join('')}
        </div>` : ``}
      </div>`;
  }

  function microtaskRow(goalId, subId, m, cat){
    const pct = microtaskPct(m);
    return `
      <div class="microtask-row">
        <div class="microtask-info">
          <div class="microtask-name">${escapeHtml(m.name)}</div>
          <div class="microtask-bar-track"><div class="microtask-bar-fill" style="width:${pct}%;background:${cat.color}"></div></div>
          <div class="microtask-stats">${microtaskCounterText(m)} · ${Math.round(pct)}%</div>
        </div>
        <button class="microquickadd-btn" data-microinc="${goalId}|${subId}|${m.id}">+</button>
      </div>`;
  }

  function fmtNum(n){
    if(n === undefined || n === null || isNaN(n)) return "0";
    return (n % 1 === 0) ? n.toString() : n.toFixed(2).replace(/\.?0+$/,'');
  }
  function escapeHtml(s){
    return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  // ---------- Mutations ----------
  function bump(id){
    const g = state.goals.find(x=>x.id===id);
    if(!g) return;
    g.amount = Math.round((g.amount + 1) * 100) / 100;
    save();
  }

  function bumpSubtask(goalId, subId){
    const g = state.goals.find(x=>x.id===goalId);
    if(!g) return;
    const s = g.subtasks.find(x=>x.id===subId);
    if(!s) return;
    s.amount = Math.round((s.amount + 1) * 100) / 100;
    save();
  }

  function bumpMicrotask(goalId, subId, microId){
    const g = state.goals.find(x=>x.id===goalId);
    if(!g) return;
    const s = g.subtasks.find(x=>x.id===subId);
    if(!s) return;
    const m = s.microtasks.find(x=>x.id===microId);
    if(!m) return;
    m.amount = Math.round((m.amount + 1) * 100) / 100;
    save();
  }

  function deleteGoal(id){
    askConfirm("Delete this goal?", ()=>{
      state.goals = state.goals.filter(g=>g.id!==id);
      save();
      toast("Goal deleted");
    });
  }

  function archiveGoal(id){
    const g = state.goals.find(x=>x.id===id);
    if(!g) return;
    g.archived = true;
    save();
    toast("Goal archived");
  }
  function restoreGoal(id){
    const g = state.goals.find(x=>x.id===id);
    if(!g) return;
    g.archived = false;
    save();
    renderArchive();
    toast("Goal restored");
  }
  function deleteGoalForever(id){
    askConfirm("Permanently delete this goal? This can't be undone.", ()=>{
      state.goals = state.goals.filter(g=>g.id!==id);
      save();
      renderArchive();
      toast("Goal deleted");
    });
  }

  const UNCAT_NAME = "Uncategorized";
  const UNCAT_COLOR = "#E0E0E0";
  function isUncat(c){ return c && c.name.trim().toLowerCase() === UNCAT_NAME.toLowerCase(); }

  function deleteCategory(id){
    const cat = state.categories.find(c=>c.id===id);
    if(!cat) return;
    const goals = state.goals.filter(g=>g.categoryId===id);
    const archivedCount = goals.filter(g=>g.archived).length;
    const n = goals.length;
    const goalWord = `${n} goal${n===1?'':'s'}${archivedCount ? ` (incl. ${archivedCount} archived)` : ''}`;
    // Deleting the Uncategorized bucket itself has nowhere to move goals, so they are deleted.
    const moveToUncat = n > 0 && !isUncat(cat);
    let msg;
    if(n === 0) msg = `Delete the category "${cat.name}"?`;
    else if(moveToUncat) msg = `Delete "${cat.name}"? Its ${goalWord} will be moved to "${UNCAT_NAME}".`;
    else msg = `Delete "${cat.name}" and its ${goalWord}? This can't be undone.`;

    askConfirm(msg, ()=>{
      if(moveToUncat){
        let target = state.categories.find(c=>c.id!==id && isUncat(c));
        if(!target){
          target = { id: uid(), name: UNCAT_NAME, color: UNCAT_COLOR };
          state.categories.push(target);
        }
        state.goals.forEach(g=>{ if(g.categoryId===id) g.categoryId = target.id; });
      } else {
        state.goals = state.goals.filter(g=>g.categoryId!==id);
      }
      state.categories = state.categories.filter(c=>c.id!==id);
      collapsed.delete(id);
      saveCollapsed();
      save();
      renderReorderList();
      toast(moveToUncat ? `Moved ${n} goal${n===1?'':'s'} to ${UNCAT_NAME}` : "Category deleted");
    });
  }

  function moveCategory(id, dir){
    const idx = state.categories.findIndex(c=>c.id===id);
    const swapIdx = idx + dir;
    if(idx === -1 || swapIdx < 0 || swapIdx >= state.categories.length) return;
    const tmp = state.categories[idx];
    state.categories[idx] = state.categories[swapIdx];
    state.categories[swapIdx] = tmp;
    save();
    renderReorderList();
  }

  // ---------- Sheets ----------
  const backdrop = document.getElementById('backdrop');
  const goalSheet = document.getElementById('goalSheet');
  const subtaskSheet = document.getElementById('subtaskSheet');
  const microtaskSheet = document.getElementById('microtaskSheet');
  const catSheet = document.getElementById('catSheet');
  const archiveSheet = document.getElementById('archiveSheet');
  const reorderSheet = document.getElementById('reorderSheet');

  function openSheet(sheet){
    backdrop.classList.add('open');
    sheet.classList.add('open');
  }
  function closeSheets(){
    backdrop.classList.remove('open');
    goalSheet.classList.remove('open');
    subtaskSheet.classList.remove('open');
    microtaskSheet.classList.remove('open');
    catSheet.classList.remove('open');
    archiveSheet.classList.remove('open');
    reorderSheet.classList.remove('open');
    editingGoalId = null;
    editingSubtaskIndex = null;
    editingMicroIndex = null;
    editingCategoryId = null;
  }
  backdrop.addEventListener('click', closeSheets);

  // ---------- Subtask editor (summary list inside Goal sheet) ----------
  function renderSubtaskEditor(){
    const box = document.getElementById('subtaskEditorList');
    box.innerHTML = pendingSubtasks.map((s, idx) => {
      const hasMicro = s.microtasks && s.microtasks.length > 0;
      return `
      <div class="subtask-summary-card">
        <div class="subtask-summary-top">
          <div class="subtask-summary-name">${escapeHtml(s.name) || 'Untitled subtask'}</div>
          <button type="button" class="rm-btn" data-idx="${idx}">×</button>
        </div>
        <div class="subtask-summary-meta">${subtaskCounterText(s)}${hasMicro ? ` · ${s.microtasks.length} microtask${s.microtasks.length===1?'':'s'}` : ''}</div>
        <button type="button" class="subtask-edit-btn" data-idx="${idx}">Edit subtask</button>
      </div>`;
    }).join('');
    box.querySelectorAll('.rm-btn').forEach(el=>{
      el.addEventListener('click', ()=>{
        const i = parseInt(el.dataset.idx, 10);
        askConfirm("Delete this subtask?", ()=>{
          pendingSubtasks.splice(i, 1);
          renderSubtaskEditor();
          updateManualFieldsState();
        });
      });
    });
    box.querySelectorAll('.subtask-edit-btn').forEach(el=>{
      el.addEventListener('click', ()=> openSubtaskSheet(parseInt(el.dataset.idx, 10)));
    });
  }
  function updateManualFieldsState(){
    document.getElementById('currentFieldWrap').classList.toggle('disabled', pendingSubtasks.length > 0);
  }
  document.getElementById('addSubtaskBtn').addEventListener('click', ()=>{
    pendingSubtasks.push({ id: uid(), name: "", amount: 0, max: 0, unit: "", microtasks: [] });
    renderSubtaskEditor();
    updateManualFieldsState();
    openSubtaskSheet(pendingSubtasks.length - 1, true);
  });

  // ---------- Subtask sheet (name/current/target/unit + its own microtasks) ----------
  function openSubtaskSheet(idx, isNew){
    editingSubtaskIndex = idx;
    subtaskIsNew = !!isNew;
    const s = pendingSubtasks[idx];
    document.getElementById('subName').value = s.name;
    document.getElementById('subAmount').value = s.amount || '';
    document.getElementById('subMax').value = s.max || '';
    document.getElementById('subUnit').value = s.unit || '';
    pendingMicrotasks = (s.microtasks || []).map(m => ({...m}));
    renderMicrotaskEditor();
    updateSubManualFieldsState();
    openSheet(subtaskSheet);
    setTimeout(()=>document.getElementById('subName').focus(), 300);
  }
  function closeSubtaskSheet(){
    subtaskSheet.classList.remove('open');
    microtaskSheet.classList.remove('open');
    editingSubtaskIndex = null;
    editingMicroIndex = null;
  }
  document.getElementById('cancelSubtaskBtn').addEventListener('click', ()=>{
    if(subtaskIsNew && editingSubtaskIndex !== null){
      pendingSubtasks.splice(editingSubtaskIndex, 1);
      renderSubtaskEditor();
      updateManualFieldsState();
    }
    closeSubtaskSheet();
  });
  document.getElementById('saveSubtaskBtn').addEventListener('click', ()=>{
    const name = document.getElementById('subName').value.trim();
    const amount = parseFloat(document.getElementById('subAmount').value) || 0;
    const subMaxRaw = document.getElementById('subMax').value.trim();
    const max = subMaxRaw === '' ? 1 : (parseFloat(subMaxRaw) || 0);
    const unit = document.getElementById('subUnit').value.trim();
    if(!name){ toast("Give it a name"); return; }
    if(max <= 0){ toast("Target must be more than 0"); return; }
    const microtasks = pendingMicrotasks
      .map(m => ({ ...m, max: (m.max === null || m.max === undefined) ? 1 : m.max }))
      .filter(m => m.name && m.name.trim() && m.max > 0)
      .map(m => ({ id: m.id || uid(), name: m.name.trim(), amount: m.amount || 0, max: m.max, unit: (m.unit||'').trim() }));
    pendingSubtasks[editingSubtaskIndex] = {
      id: pendingSubtasks[editingSubtaskIndex].id,
      name, amount, max, unit, microtasks
    };
    renderSubtaskEditor();
    closeSubtaskSheet();
  });

  // ---------- Microtask list (summary cards inside Subtask sheet) ----------
  function renderMicrotaskEditor(){
    const box = document.getElementById('microtaskEditorList');
    box.innerHTML = pendingMicrotasks.map((m, idx) => `
      <div class="microtask-summary-card">
        <div class="subtask-summary-top">
          <div class="subtask-summary-name">${escapeHtml(m.name) || 'Untitled microtask'}</div>
          <button type="button" class="rm-btn micro-rm-btn" data-idx="${idx}">×</button>
        </div>
        <div class="subtask-summary-meta">${microtaskCounterText({ amount: m.amount, max: m.max || 0, unit: m.unit })}</div>
        <button type="button" class="micro-edit-btn" data-idx="${idx}">Edit microtask</button>
      </div>
    `).join('');
    box.querySelectorAll('.micro-edit-btn').forEach(el=>{
      el.addEventListener('click', ()=> openMicrotaskSheet(parseInt(el.dataset.idx, 10), false));
    });
    box.querySelectorAll('.micro-rm-btn').forEach(el=>{
      el.addEventListener('click', ()=>{
        const i = parseInt(el.dataset.idx, 10);
        askConfirm("Delete this microtask?", ()=>{
          pendingMicrotasks.splice(i, 1);
          renderMicrotaskEditor();
          updateSubManualFieldsState();
        });
      });
    });
  }

  // ---------- Microtask sheet (blue) ----------
  function openMicrotaskSheet(idx, isNew){
    editingMicroIndex = idx;
    microIsNew = !!isNew;
    const m = pendingMicrotasks[idx];
    document.getElementById('microName').value = m.name || '';
    document.getElementById('microAmount').value = m.amount || '';
    document.getElementById('microMax').value = m.max || '';
    document.getElementById('microUnit').value = m.unit || '';
    microtaskSheet.classList.add('open');
    setTimeout(()=>document.getElementById('microName').focus(), 300);
  }
  function closeMicrotaskSheet(){
    microtaskSheet.classList.remove('open');
    editingMicroIndex = null;
  }
  document.getElementById('cancelMicrotaskBtn').addEventListener('click', ()=>{
    if(microIsNew && editingMicroIndex !== null){
      pendingMicrotasks.splice(editingMicroIndex, 1);
      renderMicrotaskEditor();
      updateSubManualFieldsState();
    }
    closeMicrotaskSheet();
  });
  document.getElementById('saveMicrotaskBtn').addEventListener('click', ()=>{
    const name = document.getElementById('microName').value.trim();
    const amount = parseFloat(document.getElementById('microAmount').value) || 0;
    const raw = document.getElementById('microMax').value.trim();
    const max = raw === '' ? 1 : (parseFloat(raw) || 0);
    const unit = document.getElementById('microUnit').value.trim();
    if(!name){ toast("Give it a name"); return; }
    if(max <= 0){ toast("Target must be more than 0"); return; }
    pendingMicrotasks[editingMicroIndex] = { id: pendingMicrotasks[editingMicroIndex].id, name, amount, max, unit };
    renderMicrotaskEditor();
    updateSubManualFieldsState();
    closeMicrotaskSheet();
  });

  function updateSubManualFieldsState(){
    document.getElementById('subCurrentFieldWrap').classList.toggle('disabled', pendingMicrotasks.length > 0);
  }
  document.getElementById('addMicrotaskBtn').addEventListener('click', ()=>{
    pendingMicrotasks.push({ id: uid(), name: "", amount: 0, max: null, unit: "" });
    renderMicrotaskEditor();
    updateSubManualFieldsState();
    openMicrotaskSheet(pendingMicrotasks.length - 1, true);
  });

  function refreshCategorySelect(){
    const sel = document.getElementById('goalCategory');
    sel.innerHTML = `<option value="">—</option>` +
      state.categories.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
  }

  function openGoalSheet(goalId){
    if(state.categories.length === 0){
      toast("Create a category first");
      openCatSheet();
      return;
    }
    refreshCategorySelect();
    editingGoalId = goalId || null;
    document.getElementById('goalSheetTitle').textContent = goalId ? "Edit Goal" : "New Goal";
    if(goalId){
      const g = state.goals.find(x=>x.id===goalId);
      document.getElementById('goalName').value = g.name;
      document.getElementById('goalAmount').value = g.amount;
      document.getElementById('goalMax').value = g.max;
      document.getElementById('goalUnit').value = g.unit || '';
      document.getElementById('goalCategory').value = g.categoryId;
      pendingSubtasks = (g.subtasks || []).map(s => ({...s}));
    } else {
      document.getElementById('goalName').value = "";
      document.getElementById('goalAmount').value = "";
      document.getElementById('goalMax').value = "";
      document.getElementById('goalUnit').value = "";
      document.getElementById('goalCategory').value = "";
      pendingSubtasks = [];
    }
    renderSubtaskEditor();
    updateManualFieldsState();
    openSheet(goalSheet);
    setTimeout(()=>document.getElementById('goalName').focus(), 300);
  }

  document.getElementById('newGoalFab').addEventListener('click', ()=>openGoalSheet(null));
  document.getElementById('cancelGoalBtn').addEventListener('click', closeSheets);

  document.getElementById('saveGoalBtn').addEventListener('click', ()=>{
    const name = document.getElementById('goalName').value.trim();
    const amount = parseFloat(document.getElementById('goalAmount').value) || 0;
    const goalMaxRaw = document.getElementById('goalMax').value.trim();
    const max = goalMaxRaw === '' ? 1 : (parseFloat(goalMaxRaw) || 0);
    const unit = document.getElementById('goalUnit').value.trim();
    const categoryId = document.getElementById('goalCategory').value;
    if(!name){ toast("Give it a name"); return; }
    if(max <= 0){ toast("Target must be more than 0"); return; }
    if(!categoryId){ toast("Choose a category"); return; }
    const subtasks = pendingSubtasks
      .filter(s => s.name && s.name.trim() && s.max > 0)
      .map(s => ({
        id: s.id || uid(), name: s.name.trim(), amount: s.amount || 0, max: s.max,
        unit: (s.unit||'').trim(), microtasks: s.microtasks || []
      }));
    if(editingGoalId){
      const g = state.goals.find(x=>x.id===editingGoalId);
      Object.assign(g, {name, amount, max, unit, categoryId, subtasks});
    } else {
      state.goals.push({ id: uid(), name, amount, max, unit, categoryId, subtasks, archived: false });
    }
    save();
    closeSheets();
  });

  document.getElementById('inlineNewCat').addEventListener('click', ()=>{
    closeSheets();
    openCatSheet();
  });

  function openCatSheet(catId){
    editingCategoryId = catId || null;
    const cat = catId ? state.categories.find(c=>c.id===catId) : null;
    document.getElementById('catSheetTitle').textContent = cat ? "Edit Category" : "New Category";
    document.getElementById('catName').value = cat ? cat.name : "";
    pendingCategoryColor = cat ? cat.color : PALETTE[state.categories.length % PALETTE.length];
    renderSwatches();
    openSheet(catSheet);
    setTimeout(()=>document.getElementById('catName').focus(), 300);
  }
  function renderSwatches(){
    const box = document.getElementById('swatches');
    const list = PALETTE.includes(pendingCategoryColor) ? PALETTE : [pendingCategoryColor, ...PALETTE];
    box.innerHTML = list.map(c=>`<span class="swatch ${c===pendingCategoryColor?'selected':''}" style="background:${c}" data-color="${c}"></span>`).join('');
    box.querySelectorAll('.swatch').forEach(el=>{
      el.addEventListener('click', ()=>{
        pendingCategoryColor = el.getAttribute('data-color');
        renderSwatches();
      });
    });
  }

  document.getElementById('newCatFab').addEventListener('click', ()=>openCatSheet(null));
  document.getElementById('cancelCatBtn').addEventListener('click', closeSheets);

  document.getElementById('saveCatBtn').addEventListener('click', ()=>{
    const name = document.getElementById('catName').value.trim();
    if(!name){ toast("Give it a name"); return; }
    if(editingCategoryId){
      const cat = state.categories.find(c=>c.id===editingCategoryId);
      if(cat){ cat.name = name; cat.color = pendingCategoryColor; }
    } else {
      state.categories.push({ id: uid(), name, color: pendingCategoryColor });
    }
    save();
    closeSheets();
  });

  // ---------- Archive ----------
  function renderArchive(){
    const box = document.getElementById('archiveList');
    const archived = state.goals.filter(g=>g.archived);
    if(archived.length === 0){
      box.innerHTML = `<div class="archive-empty">No archived goals yet.</div>`;
      return;
    }
    box.innerHTML = archived.map(g=>{
      const cat = state.categories.find(c=>c.id===g.categoryId);
      const pct = Math.round(goalPct(g));
      return `
        <div class="archive-item">
          <div class="archive-item-top">
            <div class="archive-item-name">${escapeHtml(g.name)}</div>
            <div class="archive-item-pct">${pct}%</div>
          </div>
          <div class="archive-item-cat">${cat ? escapeHtml(cat.name) : 'Uncategorized'}</div>
          <div class="archive-item-actions">
            <button class="restore" data-restore="${g.id}">Restore</button>
            <button class="forget" data-forget="${g.id}">Delete forever</button>
          </div>
        </div>`;
    }).join('');
    box.querySelectorAll('[data-restore]').forEach(el=>{
      el.addEventListener('click', ()=>restoreGoal(el.getAttribute('data-restore')));
    });
    box.querySelectorAll('[data-forget]').forEach(el=>{
      el.addEventListener('click', ()=>deleteGoalForever(el.getAttribute('data-forget')));
    });
  }
  document.getElementById('archiveViewBtn').addEventListener('click', ()=>{
    renderArchive();
    openSheet(archiveSheet);
  });
  document.getElementById('closeArchiveBtn').addEventListener('click', closeSheets);

  // ---------- Reorder categories ----------
  function renderReorderList(){
    const box = document.getElementById('reorderList');
    if(state.categories.length === 0){
      box.innerHTML = `<div class="archive-empty">No categories yet.</div>`;
      return;
    }
    box.innerHTML = state.categories.map((c, idx) => `
      <div class="reorder-item">
        <span class="cat-dot" style="background:${c.color}"></span>
        <span class="reorder-name">${escapeHtml(c.name)}</span>
        <div class="reorder-btns">
          <button data-moveup="${c.id}" ${idx===0 ? 'disabled' : ''}>▲</button>
          <button data-movedown="${c.id}" ${idx===state.categories.length-1 ? 'disabled' : ''}>▼</button>
          <button data-editcat="${c.id}" aria-label="Edit">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
          </button>
          <button class="del" data-delcat="${c.id}" aria-label="Delete">×</button>
        </div>
      </div>
    `).join('');
    box.querySelectorAll('[data-moveup]').forEach(el=>{
      el.addEventListener('click', ()=> moveCategory(el.getAttribute('data-moveup'), -1));
    });
    box.querySelectorAll('[data-movedown]').forEach(el=>{
      el.addEventListener('click', ()=> moveCategory(el.getAttribute('data-movedown'), 1));
    });
    box.querySelectorAll('[data-editcat]').forEach(el=>{
      el.addEventListener('click', ()=>{ const id = el.getAttribute('data-editcat'); closeSheets(); openCatSheet(id); });
    });
    box.querySelectorAll('[data-delcat]').forEach(el=>{
      el.addEventListener('click', ()=> deleteCategory(el.getAttribute('data-delcat')));
    });
  }
  document.getElementById('reorderBtn').addEventListener('click', ()=>{
    renderReorderList();
    openSheet(reorderSheet);
  });
  document.getElementById('closeReorderBtn').addEventListener('click', closeSheets);

  // ---------- Settings: export/import/clear ----------
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsPanel = document.getElementById('settingsPanel');
  settingsBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    settingsPanel.classList.toggle('open');
  });
  document.addEventListener('click', ()=> settingsPanel.classList.remove('open'));

  document.getElementById('exportBtn').addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `progress-backup-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    toast("Backup downloaded");
  });

  document.getElementById('importBtn').addEventListener('click', ()=>{
    document.getElementById('importFile').click();
  });
  document.getElementById('importFile').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const data = JSON.parse(ev.target.result);
        if(!data.categories || !data.goals) throw new Error("bad format");
        data.goals.forEach(normalizeGoal);
        const apply = ()=>{ state = data; save(); toast("Backup restored"); };
        if(state.categories.length || state.goals.length){
          askConfirm("This replaces your current data with the backup. Continue?", apply, "Replace");
        } else {
          apply();
        }
      }catch(err){
        toast("Couldn't read that file");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  });

  document.getElementById('clearBtn').addEventListener('click', ()=>{
    askConfirm("Delete everything? This can't be undone.", ()=>{
      state = { categories: [], goals: [] };
      collapsed = new Set();
      saveCollapsed();
      save();
      toast("All cleared");
    }, "Delete all");
  });

  render();
})();
</script>
</body>
</html>
